plugins {
    id 'com.android.application' version '9.4.1'
}

android {
    namespace 'me.algorhythmics.diracui'

    compileSdk 37

    defaultConfig {
        applicationId 'me.algorhythmics.diracui'
        minSdk 23
        targetSdk 37
        versionCode 1
        versionName '1.0'
    }

    buildFeatures {
        aidl true
    }

	splits {
		abi {
			enable true
		}
	}

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

// Compiles with JDK 21 whatever JDK runs Gradle - the system default here is 17,
// which cannot compile source 21. Gradle picks it up from the installed JVMs.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}
