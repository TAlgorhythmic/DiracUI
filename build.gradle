plugins {
    id 'com.android.application' version '9.4.1'
}

android {
    namespace 'me.algorhythmics'

    compileSdk 37

    defaultConfig {
        applicationId 'me.algorhythmics'
        minSdk 23
        targetSdk 37
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

